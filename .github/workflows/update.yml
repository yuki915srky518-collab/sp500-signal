name: Update market data

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 07:00 JST (Tue-Sat), after the US market close
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main]
    paths: ['index.html', 'fetch.ps1', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch market data
        shell: powershell
        run: .\fetch.ps1
      - name: Commit data.js
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update market data $(date -u +%F)"
            git push
          fi

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html data.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
